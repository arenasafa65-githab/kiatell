<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ثبت کالای جدید</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #1a3d36;
      font-family: Tahoma, Vazirmatn, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 1100px;
      max-width: 100%;
      background: #fff;
      border-radius: 28px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
    }
    .head {
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid #eef3f0;
    }
    .x {
      width: 42px; height: 42px; border-radius: 12px; border: 1px solid #e4eee9;
      background: #fff; font-size: 20px; color: #6b7c76; cursor: pointer;
    }
    .title-wrap { display: flex; align-items: center; gap: 12px; }
    .boxico {
      width: 48px; height: 48px; border-radius: 16px; background: #eaf6f0;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .crumb { font-size: 11px; color: #8aa396; }
    h1 { margin: 0; font-size: 22px; color: #16382f; }
    .body { display: flex; flex-direction: row-reverse; min-height: 540px; }
    .side {
      width: 260px; background: #eaf6f0; padding: 20px 18px 16px;
      display: flex; flex-direction: column;
    }
    .side h3 { margin: 0 0 16px; font-size: 12px; color: #8aa396; font-weight: 700; }
    .shield {
      width: 58px; height: 58px; border-radius: 18px; background: #fff; margin: 0 auto 12px;
      display: flex; align-items: center; justify-content: center; font-size: 28px; color: #0b6b45;
    }
    .side .h { text-align: center; font-weight: 800; font-size: 16px; color: #16382f; }
    .side p { text-align: center; font-size: 11px; color: #6f8b82; line-height: 1.8; margin: 8px 8px 0; }
    .meta { border-top: 1px solid #d7ece3; margin-top: 18px; padding-top: 14px; font-size: 13px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .row .k { color: #8aa396; }
    .row .v { font-weight: 800; color: #16382f; }
    .acts { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 20px; }
    .b1 {
      height: 48px; background: #0b6b45; color: #fff; border: 0; border-radius: 14px;
      font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit;
    }
    .b2 {
      height: 48px; background: #fff; color: #0b6b45; border: 1.5px solid #0b6b45;
      border-radius: 14px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit;
    }
    .b3 { background: none; border: 0; color: #0b6b45; font-weight: 800; font-size: 13px; padding: 8px; cursor: pointer; font-family: inherit; }
    .hint { border-top: 1px solid #d7ece3; padding-top: 12px; font-size: 10px; color: #8aa396; text-align: center; }
    .form { flex: 1; padding: 26px 36px; }
    .step { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; justify-content: flex-start; }
    .badge {
      width: 28px; height: 28px; border-radius: 999px; background: #eaf6f0; color: #0b6b45;
      font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    }
    .step span { font-weight: 800; color: #16382f; font-size: 15px; }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    label { display: block; font-size: 12px; font-weight: 700; color: #16382f; margin-bottom: 8px; }
    label .s { color: #e11d48; }
    input, select, textarea {
      width: 100%; height: 48px; padding: 0 16px; border-radius: 14px;
      background: #f3faf6; border: 1px solid #d7ece3; font-size: 13px;
      font-family: inherit; color: #16382f;
    }
    input.focus { background: #fff; border: 1.5px solid #0b6b45; }
    textarea { height: 56px; padding-top: 12px; resize: none; }
    hr { border: 0; height: 1px; background: #eef3f0; margin: 28px 0 22px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="title-wrap">
        <div>
          <div class="crumb">فرم اطلاعات / انبار</div>
          <h1>ثبت کالای جدید</h1>
        </div>
        <div class="boxico">📦</div>
      </div>
      <button class="x" type="button">×</button>
    </div>
    <div class="body">
      <aside class="side">
        <h3>خلاصه عملیات</h3>
        <div class="shield">🛡️</div>
        <div class="h">کالای جدید</div>
        <p>اطلاعات کالا را تکمیل کنید و آن را به موجودی فروشگاه اضافه کنید.</p>
        <div class="meta">
          <div class="row"><span class="v">در حال ثبت</span><span class="k">وضعیت</span></div>
          <div class="row"><span class="v">موبایل</span><span class="k">دسته‌بندی</span></div>
        </div>
        <div class="acts">
          <button class="b1" type="button">💾 ثبت و ذخیره کالا</button>
          <button class="b2" type="button">↻ ذخیره و ثبت کالای بعدی</button>
          <button class="b3" type="button">انصراف و بستن</button>
          <div class="hint">اطلاعات پس از ثبت در پنل مدیریت است. ؟</div>
        </div>
      </aside>
      <div class="form">
        <div class="step"><div class="badge">۰۱</div><span>اطلاعات اصلی کالا</span></div>
        <div class="g2">
          <div>
            <label><span class="s">* </span>نام کالا</label>
            <input class="focus" placeholder="مثلاً آیفون ۱۵ پرو ۲۵۶ گیگ" />
          </div>
          <div>
            <label><span class="s">* </span>کد کالا / SKU</label>
            <input placeholder="IPH-15P-256" value="IPH-15P-256" />
          </div>
          <div>
            <label>برند</label>
            <input placeholder="مثلاً Apple" />
          </div>
          <div>
            <label>دسته‌بندی</label>
            <select><option>موبایل</option><option>لوازم جانبی</option><option>تبلت</option></select>
          </div>
        </div>
        <hr />
        <div class="step"><div class="badge">۰۲</div><span>قیمت‌گذاری و موجودی</span></div>
        <div class="g3">
          <div>
            <label><span class="s">* </span>قیمت فروش (تومان)</label>
            <input placeholder="۰" />
          </div>
          <div>
            <label>قیمت خرید (تومان)</label>
            <input placeholder="۰" />
          </div>
          <div>
            <label><span class="s">* </span>موجودی اولیه</label>
            <input placeholder="۰" />
          </div>
        </div>
        <div style="margin-top:16px">
          <label>توضیحات / مشخصات</label>
          <textarea placeholder="رنگ، حافظه، گارانتی و سایر مشخصات..."></textarea>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
